# The repo's only automated correctness gate. Ported from notifier, where
# every green result before it came from someone choosing to run the suite
# (notifier#27). Work lands on main through PRs merged on GitHub
# (.skills/merge_mode = pr), and main's push run is the one deploy.sh reads
# (#11).
#
# `pre-commit` is not a substitute — it runs ruff and nothing else.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Supersede PR runs; never cancel a run on main. On this single-VM setup
  # main is the deployed code, so cancelling costs that commit its only signal.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The attest step reads the combined status (#133); unlisted keys are none.
  statuses: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. These jobs finish in under a minute, so
    # anything past this is wedged — a hung `uv sync`, or a postgres that never
    # comes up — and should stop burning runner time rather than sit there.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # Two steps, not one: a red run should say whether it was a lint
      # violation or a formatting one without anyone opening the log.
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: status
          POSTGRES_PASSWORD: status
          # The _test suffix is load-bearing, not cosmetic. src/core/db_safety.py
          # classifies a database by the suffix of its *name*, and
          # get_database_url() is the chokepoint every connection crosses. A
          # container named `status` fails the whole suite at fixture setup
          # with a production-refusal error that reads nothing like a typo.
          POSTGRES_DB: status_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://status:status@localhost:5432/status_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # Pinned because [tool.coverage.run] core = "sysmon" needs CPython
          # >= 3.12. An older interpreter falls back to the default trace core
          # *silently* and reports ~6 points low — against the live
          # fail_under = 80 that is a quiet near-miss, not a loud failure.
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # Did the local gate pass on exactly this PR's head? (#133,
      # gregoryfoster/skills#688) With .skills/attest-local-gate on,
      # shipping-work's push.sh posts `gate/local` = success once pre-ship.sh
      # has passed on the clean tree it pushed.
      #
      # Pull requests only. A push to main is a merge GitHub made, which
      # carries no status, and it is the run deploy.sh reads (#11): reading
      # there could skip nothing, and a refused read would fail main's `test`.
      # Unset reads as not attested, so the suite runs.
      #
      # HEAD is the PR's head: on pull_request, github.sha is the merge commit,
      # which nobody gated. The combined status keeps each context's latest
      # state; /statuses lists every status ever posted, so a later failure
      # would still count. A page is 30 contexts unless more are asked for. A
      # refused read fails this step: loud, never a silent skip. The verdict is
      # logged as well as written.
      #
      # These comments sit here, not in `run:`: tests/ci splits every `run:`
      # into shell words, and an apostrophe there is an unbalanced quote.
      - name: Attested by the local gate?
        id: attest
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/$HEAD/status?per_page=100" \
                --jq '[.statuses[] | select(.context == "gate/local" and .state == "success")] | length')
          echo "attested=$([ "$n" -gt 0 ] && echo yes || echo no)" | tee -a "$GITHUB_OUTPUT"
      # Skipped only for an attested commit, on a branch push or a pull
      # request, and never for a bot's PR (Dependabot) or a fork's: neither
      # came from a local gate. Everything else (a manual run, a tag) always
      # runs it, and so does every push to main, since the attest step reads
      # nothing there. The reference's `if:`, verbatim.
      #
      # Step-level, not job-level: a skipped step leaves `test` success.
      # lint and migrations never skip; the local gate runs no alembic. An
      # attested PR goes without coverage's fail_under (pre-ship.sh runs the
      # suite --no-cov) until main's push run, the backstop. No schedule: with
      # merge_mode pr, nothing reaches main without that run.
      #
      # No -m and no --cov here: both live in [tool.pytest.ini_options]
      # addopts. A second spelling on the command line overrides rather than
      # composes, and gives the marker expression somewhere to drift.
      # STATUS_SECRET_KEY is not needed — conftest generates a throwaway one.
      - name: Run tests
        if: >-
          steps.attest.outputs.attested != 'yes'
          || (github.event_name != 'push' && github.event_name != 'pull_request')
          || startsWith(github.ref, 'refs/tags/')
          || (github.event_name == 'pull_request'
              && (github.event.pull_request.user.type == 'Bot'
                  || github.event.pull_request.head.repo.full_name != github.repository))
        run: uv run pytest

  migrations:
    # The one gate the test suite structurally cannot be. tests/conftest.py
    # builds schema with Base.metadata.create_all, so a broken migration chain
    # never surfaces in pytest — it surfaces on deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: status
          POSTGRES_PASSWORD: status
          # Deliberately its own database, and empty. Reusing the test job's
          # would work until create_all ran first, then fail `upgrade head`
          # on "relation already exists".
          POSTGRES_DB: status_migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # No STATUS_ALLOW_PROD_DB. alembic/env.py crosses src/core/db_safety.py
      # (#15), and the database's _test suffix is what lets it through.
      DATABASE_URL: postgresql+asyncpg://status:status@localhost:5432/status_migrations_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Migrate an empty database from scratch
        run: uv run alembic upgrade head
      - name: Fail on model/migration drift
        run: uv run alembic check
