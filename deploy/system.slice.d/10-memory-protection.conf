# The grant every MemoryLow= under system.slice draws on (notifier#85).
#
# Install to /etc/systemd/system/system.slice.d/; see docs/RUNBOOK.md.
# `systemctl daemon-reload` applies it, with no restart.
#
# cgroup v2 caps a unit's effective protection at what every ancestor grants
# (effective_protection() in mm/page_counter.c), and system.slice ships
# memory.low 0. So from notifier#74 to notifier#85, status.service's MemoryLow=192M
# protected nothing, while `systemctl show -p MemoryLow` and the unit's own
# memory.low both read 192M. memory_recursiveprot would not have helped: it
# shares a parent's *unclaimed* grant, and a parent at 0 has none. This
# host's cgroup2 mount does not carry it anyway.
#
# Exactly the sum of what its children claim:
#   status.service          192M
#   system-postgresql.slice   192M  (passed on to postgresql@16-main)
# Less and each child keeps only a usage-proportional share. More is
# protection nothing here claims. tests/deploy/test_memory_reservation.py
# holds the sum.
#
# systemd reads a # only at the start of a line, so comments stay above.
[Slice]
MemoryLow=384M
