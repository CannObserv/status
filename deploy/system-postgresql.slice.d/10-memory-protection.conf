# The grant postgresql@16-main.service's MemoryLow= draws on (notifier#85).
#
# Install to /etc/systemd/system/system-postgresql.slice.d/; see
# docs/RUNBOOK.md. `systemctl daemon-reload` applies it, with no restart.
#
# A template instance runs in an implicit system-<template>.slice, which
# systemd creates with no settings. It grants 0 and clamps the unit exactly
# as system.slice did. Without memory_recursiveprot, which this host's mount
# lacks, the system.slice grant does not pass through it. On address-validator,
# postgresql@16-main stayed unprotected under a working system.slice grant
# until this link had its own grant (gregoryfoster/skills host-memory.md § 3).
#
# Exactly postgresql@16-main.service's claim, since it is the only cluster.
[Slice]
MemoryLow=192M
