# Atomic-allocation reserve for notifier's host (notifier#74).
#
# Install to /etc/sysctl.d/99-status-memory.conf; see docs/RUNBOOK.md.
#
# Sized on notifier's 3.8 GiB host (notifier#74) and carried over as a
# starting point; Phase 3 re-measures on co-status's own VM.
#
# MemoryLow= and OOMScoreAdjust= on the production units are cgroup properties.
# Neither can do anything for an allocation made in interrupt context — and
# that is precisely what failed on CannObserv/broker on 2026-09-16, where the
# kernel failed atomic allocations in tailscaled and ksoftirqd while nothing
# was OOM-killed at all and the bus stayed down 57m 48s
# (gregoryfoster/skills#295, references/troubleshooting.md row U).
#
# The kernel's default scales off total RAM and lands near 8 MiB on this
# 3.8 GiB host. That is far too thin for a no-swap machine to absorb a spike
# on the order of the 1.2 G a cold SocratiCode install was measured to reach:
# with no swap there is no slow path, so the reserve is the only buffer
# between a spike and an allocation failure somewhere unrelated.
#
# 64 MiB is ~1.7% of RAM. Raising it further costs directly — the reserve is
# memory nothing else may use — and past a few percent it starts causing the
# reclaim pressure it is meant to relieve.
vm.min_free_kbytes = 65536
