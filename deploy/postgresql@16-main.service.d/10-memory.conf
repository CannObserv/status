# Memory reservation for the one PostgreSQL cluster (notifier#85).
#
# Install to /etc/systemd/system/postgresql@16-main.service.d/; see
# docs/RUNBOOK.md. The drop-in targets this instance, not every instance
# through postgresql@.service.d/: a second cluster would claim a second 192M
# that the slices above do not grant.
#
# The API is only as protected as its database. status.service's floor
# keeps its own working set resident, but a request still stalls on a
# reclaimed page of the cluster behind it. Same sizing rule as the service's
# floor: clear the measured peak with room. The peak was 121 MiB on
# 2026-09-18 (notifier#74), with shared_buffers at 128MB. This cluster also serves
# status_dev and status_test, so their pages get the same floor. One
# cluster can only have one floor.
#
# No OOMScoreAdjust= here: Ubuntu's unit already sets -900, and earlyoom's
# --avoid names postgres.
[Service]
MemoryLow=192M
